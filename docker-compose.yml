version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renewcred
      POSTGRES_PASSWORD: renewcred_dev_pw
      POSTGRES_DB: renewcred_cms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewcred -d renewcred_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://renewcred:renewcred_dev_pw@db:5432/renewcred_cms?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_before_deploying}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_before_deploying}
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 5
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  admin-frontend:
    build: ./admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_PUBLIC_SITE_URL: http://localhost:3001
    ports:
      - "3000:3000"

  public-frontend:
    build: ./public-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3001:3000"

volumes:
  db_data:
  backend_uploads:
